services:
  sqlserver:
    build: .
    container_name: sqlserver-quanan
    user: root
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=password123!
    volumes:
      - mssql_data:/var/opt/mssql/data
      - ./create-database.sql:/usr/src/app/create-database.sql:ro
    restart: unless-stopped

volumes:
  mssql_data:
